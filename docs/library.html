<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="GG's project library — 18 open source cybersecurity tools, AI systems, and offensive security frameworks by Geevarghese K Thomas." />
  <meta property="og:title" content="Project Library — GG" />
  <meta property="og:description" content="18 open source cybersecurity tools, AI systems, and offensive security frameworks." />
  <meta property="og:url" content="https://itgg.space/library.html" />
  <meta property="og:type" content="website" />
  <link rel="canonical" href="https://itgg.space/library.html" />
  <title>Library — GG</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#101312;--ink:#e8eee9;--muted:#9ba39d;--dim:#6b746d;--line:#252a27;--lime:#c8ff4a;--card:#171c19;--card-h:#1e2421;--red:#ff6b6b;--blue:#6bc5ff;--purple:#c78aff;--orange:#ffb06b}
    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth;scrollbar-width:none}
    html::-webkit-scrollbar{display:none}
    body{background:var(--bg);color:var(--ink);font-family:Manrope,Arial,sans-serif}

    .noise{position:fixed;inset:0;pointer-events:none;opacity:.03;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.7' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");z-index:0}

    /* NAV */
    .nav{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(20px,5vw,80px);position:relative;z-index:5}
    .brand{color:var(--ink);font-size:24px;text-decoration:none;font-weight:800;letter-spacing:-2px}
    .brand span{color:var(--lime)}
    .nav-links{display:flex;gap:28px;align-items:center}
    .nav-links a{font-size:12px;color:var(--muted);text-decoration:none;letter-spacing:.08em;text-transform:uppercase;transition:color .2s}
    .nav-links a:hover{color:var(--ink)}
    .nav-links a.active{color:var(--lime)}
    .gh-link{border:1px solid var(--line);border-radius:999px;padding:10px 16px;font-size:11px;color:var(--ink);text-decoration:none;transition:border-color .2s,background .2s}
    .gh-link:hover{border-color:var(--lime);background:rgba(200,255,74,.05)}

    /* HERO */
    .hero{padding:clamp(40px,6vw,80px) clamp(20px,5vw,80px) 0;position:relative;z-index:2}
    .hero-top{display:flex;flex-direction:column;align-items:flex-start;gap:0;margin-bottom:8px}
    .eyebrow{font:11px 'DM Mono',monospace;letter-spacing:.1em;color:var(--dim);margin-bottom:18px}
    .hero h1{font-size:clamp(40px,6vw,80px);font-weight:800;letter-spacing:-.05em;line-height:1.05}
    .hero h1 em{font-family:Georgia,serif;font-weight:400;color:var(--lime)}
    .hero-sub{color:var(--muted);font-size:16px;line-height:1.7;max-width:560px;margin:20px 0 32px}
    .hero-count{font:12px 'DM Mono',monospace;color:var(--dim);letter-spacing:.05em;margin-top:14px}
    .hero-count b{color:var(--lime)}

    /* SEARCH */
    .search-bar{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 20px;width:100%;max-width:560px;transition:border-color .2s,box-shadow .2s}
    .search-bar:focus-within{border-color:rgba(200,255,74,.4);box-shadow:0 0 0 3px rgba(200,255,74,.06)}
    .search-bar svg{width:16px;height:16px;color:var(--dim);flex-shrink:0}
    .search-bar input{flex:1;background:none;border:none;outline:none;color:var(--ink);font:14px Manrope,sans-serif;padding:14px 0}
    .search-bar input::placeholder{color:var(--dim)}
    .clear-btn{background:none;border:none;color:var(--dim);font-size:16px;cursor:pointer;display:none;padding:0 0 0 8px;line-height:1}
    .clear-btn.show{display:block}
    .clear-btn:hover{color:var(--ink)}

    /* FILTERS */
    .filters{display:flex;gap:8px;flex-wrap:wrap;padding:0 clamp(20px,5vw,80px);margin-top:28px;position:relative;z-index:2}
    .filter{font:12px 'DM Mono',monospace;color:var(--dim);background:transparent;border:1px solid var(--line);border-radius:8px;padding:8px 16px;cursor:pointer;transition:all .2s;letter-spacing:.02em}
    .filter:hover{color:var(--muted);border-color:#3a403c;background:var(--card)}
    .filter.active{color:var(--bg);background:var(--lime);border-color:var(--lime);font-weight:500}
    .filter .n{opacity:.5;margin-left:4px;font-size:11px}

    /* GRID */
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;padding:28px clamp(20px,5vw,80px) 100px;position:relative;z-index:2}

    /* CARD */
    .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px;text-decoration:none;color:inherit;display:flex;flex-direction:column;transition:border-color .25s,background .25s,transform .25s,box-shadow .25s}
    .card:hover{border-color:#3a403c;background:var(--card-h);transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,.3)}

    .card-head{display:flex;align-items:center;gap:14px;margin-bottom:16px}
    .card-icon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font:14px 'DM Mono',monospace;font-weight:500;flex-shrink:0;letter-spacing:-.02em}
    .card-icon.red{background:rgba(255,107,107,.1);color:var(--red);border:1px solid rgba(255,107,107,.15)}
    .card-icon.blue{background:rgba(107,197,255,.1);color:var(--blue);border:1px solid rgba(107,197,255,.15)}
    .card-icon.purple{background:rgba(199,138,255,.1);color:var(--purple);border:1px solid rgba(199,138,255,.15)}
    .card-icon.orange{background:rgba(255,176,107,.1);color:var(--orange);border:1px solid rgba(255,176,107,.15)}
    .card-name{font-size:17px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
    .card-cat{font:10px 'DM Mono',monospace;color:var(--dim);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}

    .card-desc{color:var(--muted);font-size:13.5px;line-height:1.65;flex:1;margin-bottom:18px}
    .card-desc .hl{color:var(--lime);font-weight:600}

    .card-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:14px}
    .card-tags{display:flex;gap:6px;flex-wrap:wrap;flex:1}
    .tag{font:10px 'DM Mono',monospace;color:var(--dim);background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:5px;padding:4px 8px;letter-spacing:.02em}
    .card-lang{font:11px 'DM Mono',monospace;color:var(--lime);opacity:.7;flex-shrink:0;display:flex;align-items:center;gap:5px}
    .card-lang::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--lime);opacity:.6}
    .card-arrow{color:var(--dim);font-size:16px;transition:color .2s,transform .2s}
    .card:hover .card-arrow{color:var(--lime);transform:translateX(2px)}

    /* EMPTY */
    .empty{grid-column:1/-1;text-align:center;padding:80px 20px}
    .empty-q{color:var(--ink);font-size:16px;font-weight:600;margin-bottom:6px}
    .empty-sub{color:var(--dim);font-size:13px}

    /* FOOTER */
    footer{border-top:1px solid var(--line);padding:20px clamp(20px,5vw,80px);display:flex;justify-content:space-between;color:var(--dim);font:10px 'DM Mono',monospace;position:relative;z-index:2}

    /* ANIMATION */
    .card{opacity:0;transform:translateY(20px);animation:cardIn .5s ease forwards}
    @keyframes cardIn{to{opacity:1;transform:translateY(0)}}

    @media(max-width:760px){
      .nav{padding:0 16px}
      .nav-links a:not(.active){display:none}
      .hero{padding:30px 16px 0}
      .filters{padding:0 16px;margin-top:20px}
      .grid{grid-template-columns:1fr;padding:20px 16px 80px;gap:12px}
      .gh-link{display:none}
      footer{padding:20px 16px;flex-direction:column;gap:8px}
    }
    @media(min-width:1400px){
      .grid{grid-template-columns:repeat(3,1fr)}
    }
  </style>
</head>
<body>
  <div class="noise"></div>

  <header class="nav">
    <a class="brand" href="index.html"><span>G</span>G.</a>
    <div class="nav-links">
      <a href="index.html#about">About</a>
      <a href="index.html#work">Work</a>
      <a class="active" href="library.html">Library</a>
      <a href="index.html#contact">Contact</a>
      <a class="gh-link" href="https://github.com/geevarghesekthomas84-sys" target="_blank" rel="noreferrer">GitHub ↗</a>
    </div>
  </header>

  <main>
    <div class="hero">
      <div class="hero-top">
        <p class="eyebrow">01 — OPEN SOURCE</p>
        <h1>Project <em>Library</em></h1>
        <p class="hero-sub">Cybersecurity tools, AI systems and offensive security frameworks. Search or filter by category.</p>
        <div class="search-bar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
          <input type="text" id="search" placeholder="Search projects..." autocomplete="off" />
          <button class="clear-btn" id="clearBtn">&times;</button>
        </div>
        <p class="hero-count" id="heroCount"></p>
      </div>
    </div>

    <div class="filters" id="filters"></div>
    <div class="grid" id="grid"></div>
  </main>

  <footer><span>© 2026 Geevarghese K Thomas</span><span>GG / PROJECT LIBRARY</span></footer>

<script>
const P=[
  {n:"RedPilot",u:"https://github.com/geevarghesekthomas84-sys/redpilot",p:"/projects/redpilot.html",d:"AI-orchestrated offensive security framework. Automated recon, CVE mapping, exploit POC generation & remediation. CLI, API, MCP, and dashboard.",l:"Python",c:"Red Team",t:["ai","pentesting","cli","mcp"],f:1},
  {n:"Gria-AI",u:"https://github.com/geevarghesekthomas84-sys/Gria-AI",p:"/projects/gria-ai.html",d:"100% private Android AI chat app powered by local LLMs. On-device Gemma inference at 40 tok/s, voice assistant, biometric vault, live hardware telemetry.",l:"Kotlin",c:"AI",t:["android","llm","privacy"],f:2},
  {n:"CyberForge",u:"https://github.com/geevarghesekthomas84-sys/geevarghesekthomas84-sys/blob/main/gists/cyberforge.py",p:"/projects/cyberforge.html",d:"1,100-line zero-dependency cybersecurity Swiss army knife. Hash cracking, encoding, XOR cipher, password auditing, file forensics, log analysis, and file integrity monitoring.",l:"Python",c:"Tools",t:["hash","forensics","single-file"],f:3},
  {n:"Recon Blade",u:"https://github.com/geevarghesekthomas84-sys/geevarghesekthomas84-sys/blob/main/gists/recon_blade.py",d:"All-in-one offensive recon multi-tool. Port scanning, HTTP header auditing, subdomain enumeration, DNS records, WHOIS, and tech fingerprinting with HTML report export.",l:"Python",c:"Red Team",t:["recon","scanning","osint"],f:4},
  {n:"GhostKit",u:"https://github.com/geevarghesekthomas84-sys/GhostKit",p:"/projects/ghostkit.html",d:"Portable cybersecurity suite for USB deployment — AI-assisted network auditing, web vulnerability scanning, packet analysis, and an offline AI Security Assistant.",l:"Python",c:"Red Team",t:["nmap","nuclei","usb","portable"],f:5},
  {n:"Insider Threat Lab",u:"https://github.com/geevarghesekthomas84-sys/insider-threat-detection-lab",d:"Comprehensive Blue Team lab for detecting insider threat breaches using Wazuh, Splunk, and ELK. 50+ custom detection rules mapped to MITRE ATT&CK.",l:"PowerShell",c:"Blue Team",t:["siem","wazuh","splunk"],f:6},
  {n:"Aegis",u:"https://github.com/geevarghesekthomas84-sys/Aegis",d:"Fully autonomous, locally hosted AI assistant for hospitals. Privacy-first architecture — patient data never leaves local infrastructure. Triage, scheduling, conversational intake.",l:"TypeScript",c:"AI",t:["healthcare","llm","privacy"],f:7},
  {n:"Dynamic Island",u:"https://github.com/geevarghesekthomas84-sys/dynamic-island-cross",d:"A Dynamic Island for your desktop: now playing, notifications, volume and charging in a floating pill. Tauri, Rust and React for Windows, macOS and Linux.",l:"TypeScript",c:"Tools",t:["tauri","rust","react","desktop"],f:8},
  {n:"PortSight",u:"https://github.com/geevarghesekthomas84-sys/PortSight",d:"High-performance, multithreaded TCP port scanner with service detection and differential scan comparison.",l:"Python",c:"Red Team",t:["networking","scanner","threads"],f:9},
  {n:"Portable Offline LLM",u:"https://github.com/geevarghesekthomas84-sys/Portable-Offline-LLM",d:"Run a fully private, offline AI assistant from a USB flash drive — no installation, no internet, no admin rights required.",l:"Batch",c:"AI",t:["llamafile","usb","offline"],f:10},
  {n:"Breach Response",u:"https://github.com/geevarghesekthomas84-sys/Insider-Threat-Breach-Response",d:"Professional SOC + DFIR project simulating a real-world enterprise insider data breach investigation in a financial organization.",l:"Docs",c:"Blue Team",t:["soc","dfir","incident-response"],f:11},
  {n:"Reverse Shell Gen",u:"https://github.com/geevarghesekthomas84-sys/reverse-shell-generator",d:"Web-based reverse shell payload generator. Supports Bash, Python, PowerShell, PHP, Ruby, Perl, Netcat. One-click copy with dark hacker UI.",l:"HTML",c:"Red Team",t:["payloads","pentesting","web"],f:12},
  {n:"LocalLens",u:"https://github.com/geevarghesekthomas84-sys/LocalLens",d:"High-performance local file search engine built with Node.js, SQLite FTS5, and Worker Threads.",l:"JavaScript",c:"Tools",t:["nodejs","sqlite","search"],f:13},
  {n:"PHP Security Posture",u:"https://github.com/geevarghesekthomas84-sys/php-security-posture",d:"Defensive PHP security posture auditing and CVE verification lab.",l:"Python",c:"Blue Team",t:["php","audit","cve"],f:14},
  {n:"Awesome Red Team",u:"https://github.com/geevarghesekthomas84-sys/awesome-red-team",d:"Curated collection of awesome Red Team / Offensive Security resources, tools, techniques, and references.",l:"Markdown",c:"Red Team",t:["awesome-list","resources"],f:15},
  {n:"ApexBank",u:"https://github.com/geevarghesekthomas84-sys/apexbank",d:"Full-stack digital banking platform with real-time fraud detection, multi-currency accounts, and glassmorphism UI.",l:"TypeScript",c:"Tools",t:["banking","fraud-detection","fullstack"],f:16},
  {n:"SlashFrame",u:"https://github.com/geevarghesekthomas84-sys/image-style-skill",d:"403 slash commands that turn a short idea into a finished AI image prompt. Works with Claude, ChatGPT, Gemini, Midjourney, Flux, and more.",l:"Python",c:"AI",t:["ai-art","prompts","claude"],f:17},
  {n:"Android AI Engineering",u:"https://github.com/geevarghesekthomas84-sys/android-ai-engineering-system",d:"14 AI engineering skills for Android development — UI/UX, frontend, testing, security, backend, DevOps, and AI integration.",l:"Kotlin",c:"AI",t:["android","engineering","compose"],f:18}
];

const catColors={"Red Team":"red","Blue Team":"blue","AI":"purple","Tools":"orange"};
const cats=["All","Red Team","Blue Team","AI","Tools"];
let active="All";

const grid=document.getElementById('grid');
const filtersEl=document.getElementById('filters');
const searchEl=document.getElementById('search');
const clearBtn=document.getElementById('clearBtn');
const heroCount=document.getElementById('heroCount');

function buildFilters(){
  filtersEl.innerHTML='';
  cats.forEach(c=>{
    const count=c==='All'?P.length:P.filter(p=>p.c===c).length;
    const b=document.createElement('button');
    b.className='filter'+(active===c?' active':'');
    b.innerHTML=c+'<span class="n">'+count+'</span>';
    b.onclick=()=>{active=c;buildFilters();render()};
    filtersEl.appendChild(b);
  });
}

function render(){
  const q=searchEl.value.toLowerCase().trim();
  let list=P.filter(p=>{
    if(active!=='All'&&p.c!==active)return false;
    if(!q)return true;
    return p.n.toLowerCase().includes(q)||p.d.toLowerCase().includes(q)||p.l.toLowerCase().includes(q)||p.c.toLowerCase().includes(q)||p.t.some(t=>t.includes(q));
  });
  list.sort((a,b)=>a.f-b.f);

  heroCount.innerHTML='Showing <b>'+list.length+'</b> of '+P.length+' open source projects';
  clearBtn.classList.toggle('show',q.length>0);

  if(!list.length){
    grid.innerHTML='<div class="empty"><p class="empty-q">No projects found</p><p class="empty-sub">Try a different search term or filter.</p></div>';
    return;
  }

  grid.innerHTML=list.map((p,i)=>{
    const col=catColors[p.c]||'orange';
    const initials=p.n.split(' ').map(w=>w[0]).join('').slice(0,2);
    const href=p.p||p.u;const ext=p.p?'':' target="_blank" rel="noreferrer"';
    return `<a class="card" href="${href}"${ext} style="animation-delay:${i*40}ms">
      <div class="card-head">
        <div class="card-icon ${col}">${initials}</div>
        <div>
          <div class="card-name">${hl(p.n,q)}</div>
          <div class="card-cat">${p.c}</div>
        </div>
      </div>
      <div class="card-desc">${hl(p.d,q)}</div>
      <div class="card-foot">
        <div class="card-tags">${p.t.slice(0,3).map(t=>'<span class="tag">'+t+'</span>').join('')}</div>
        <span class="card-lang">${p.l}</span>
        <span class="card-arrow">→</span>
      </div>
    </a>`;
  }).join('');
}

function hl(text,q){
  if(!q)return text;
  const re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
  return text.replace(re,'<span class="hl">$1</span>');
}

searchEl.addEventListener('input',render);
clearBtn.addEventListener('click',()=>{searchEl.value='';render();searchEl.focus()});

buildFilters();
render();
</script>
</body>
</html>
