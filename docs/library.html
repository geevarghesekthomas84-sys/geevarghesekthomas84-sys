<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="GG's project library — cybersecurity tools, AI systems, and offensive security frameworks." />
  <title>Library — GG</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#202124;--surface:#303134;--ink:#bdc1c6;--white:#e8eaed;--url-green:#9aa0a6;--link:#8ab4f8;--link-visited:#c58af9;--lime:#c8ff4a;--line:#3c4043;--search-bg:#303134}
    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth;scrollbar-width:none}
    html::-webkit-scrollbar{display:none}
    body{background:var(--bg);color:var(--ink);font-family:arial,sans-serif;font-size:14px;line-height:1.58}

    /* SEARCH HEADER */
    .search-header{background:var(--bg);border-bottom:1px solid var(--line);padding:20px 0 0;position:sticky;top:0;z-index:10}
    .search-top{display:flex;align-items:center;gap:24px;padding:0 clamp(16px,7vw,160px);margin-bottom:20px}
    .logo{color:var(--white);font-family:Manrope,sans-serif;font-size:26px;font-weight:800;letter-spacing:-2px;text-decoration:none;flex-shrink:0}
    .logo span{color:var(--lime)}
    .search-box{display:flex;align-items:center;background:var(--search-bg);border:1px solid var(--line);border-radius:24px;padding:0 16px;flex:1;max-width:692px;transition:border-color .2s,box-shadow .2s}
    .search-box:focus-within{border-color:var(--link);box-shadow:0 1px 6px rgba(32,33,36,.28)}
    .search-icon{width:20px;height:20px;color:#9aa0a6;flex-shrink:0}
    .search-box input{flex:1;background:none;border:none;outline:none;color:var(--white);font:16px arial,sans-serif;padding:12px 12px}
    .search-box input::placeholder{color:#9aa0a6}
    .search-clear{background:none;border:none;color:#9aa0a6;font-size:20px;cursor:pointer;padding:4px;display:none;line-height:1}
    .search-clear.show{display:block}
    .search-clear:hover{color:var(--white)}

    /* TABS BAR */
    .tabs-bar{display:flex;align-items:center;gap:4px;padding:0 clamp(16px,7vw,160px);padding-left:calc(clamp(16px,7vw,160px) + 50px)}
    .tab{font-size:13px;color:#969ba1;background:none;border:none;border-bottom:3px solid transparent;padding:8px 16px;cursor:pointer;transition:color .15s,border-color .15s;text-transform:capitalize;letter-spacing:.02em}
    .tab:hover{color:var(--white)}
    .tab.active{color:var(--link);border-bottom-color:var(--link)}

    /* RESULTS */
    .results-wrap{max-width:692px;padding:18px clamp(16px,7vw,160px) 80px;padding-left:calc(clamp(16px,7vw,160px) + 50px)}
    .result-info{color:#9aa0a6;font-size:12px;padding:4px 0 12px}

    /* SINGLE RESULT — Google style */
    .result{margin-bottom:28px}
    .result-site{display:flex;align-items:center;gap:10px;margin-bottom:4px}
    .result-favicon{width:26px;height:26px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--lime);flex-shrink:0;border:1px solid var(--line)}
    .result-url-wrap{display:flex;flex-direction:column;min-width:0}
    .result-site-name{font-size:14px;color:var(--white);line-height:1.3}
    .result-url{font-size:12px;color:var(--url-green);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:500px;line-height:1.3}
    .result-title{font-size:20px;color:var(--link);text-decoration:none;display:block;line-height:1.3;margin-bottom:4px;font-weight:400}
    .result a.result-title:visited{color:var(--link-visited)}
    .result:hover .result-title{text-decoration:underline}
    .result-desc{color:var(--ink);font-size:14px;line-height:1.58;max-width:600px}
    .result-desc .hl{color:var(--white);font-weight:700}
    .result-tags{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
    .result-tag{font-size:11px;color:#9aa0a6;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:3px 8px}

    /* EMPTY STATE */
    .empty{text-align:center;padding:60px 20px;color:#9aa0a6}
    .empty p{font-size:14px;margin-top:8px}

    /* FOOTER */
    .gfoot{background:var(--surface);border-top:1px solid var(--line);padding:16px clamp(16px,7vw,160px);display:flex;justify-content:space-between;color:#9aa0a6;font-size:12px;position:relative;z-index:2}

    @media(max-width:760px){
      .search-top{padding:0 16px;gap:12px}
      .tabs-bar{padding:0 16px}
      .results-wrap{padding:18px 16px 80px}
      .logo{font-size:22px}
      .search-box input{font-size:14px;padding:10px 8px}
      .result-title{font-size:18px}
      .result-url{max-width:240px}
      .gfoot{padding:16px;flex-direction:column;gap:8px}
    }
  </style>
</head>
<body>

  <div class="search-header">
    <div class="search-top">
      <a class="logo" href="index.html"><span>G</span>G.</a>
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input type="text" id="search" placeholder="Search GG's projects..." autocomplete="off" />
        <button class="search-clear" id="clearBtn" aria-label="Clear search">&times;</button>
      </div>
    </div>
    <div class="tabs-bar" id="tabs"></div>
  </div>

  <main>
    <div class="results-wrap">
      <div class="result-info" id="resultInfo"></div>
      <div id="results"></div>
    </div>
  </main>

  <footer class="gfoot"><span>© 2026 Geevarghese K Thomas</span><span>GG / PROJECT LIBRARY</span></footer>

  <script>
  const projects=[
    {name:"RedPilot",slug:"redpilot",url:"https://github.com/geevarghesekthomas84-sys/redpilot",desc:"AI-orchestrated offensive security framework. Automated recon, CVE mapping, exploit POC generation & remediation. CLI, API, MCP, and dashboard. Powered by Gemini, Claude, Ollama & LM Studio.",lang:"Python",cat:"Red Team",tags:["python","ai","pentesting","red-team"],featured:1},
    {name:"Gria-AI",slug:"Gria-AI",url:"https://github.com/geevarghesekthomas84-sys/Gria-AI",desc:"100% private Android AI chat app delivering ChatGPT-grade conversations powered by local LLMs. On-device Gemma inference at 40 tok/s, voice assistant, biometric vault, live hardware telemetry.",lang:"Kotlin",cat:"AI",tags:["kotlin","android","llm","privacy"],featured:2},
    {name:"CyberForge",slug:"cyberforge.py",url:"https://github.com/geevarghesekthomas84-sys/geevarghesekthomas84-sys/blob/main/gists/cyberforge.py",desc:"1,100-line zero-dependency cybersecurity Swiss army knife. Hash cracking, encoding, XOR cipher, password auditing, file forensics, log analysis, and file integrity monitoring — one Python file.",lang:"Python",cat:"Tools",tags:["python","hash","forensics","single-file"],featured:3},
    {name:"Recon Blade",slug:"recon_blade.py",url:"https://github.com/geevarghesekthomas84-sys/geevarghesekthomas84-sys/blob/main/gists/recon_blade.py",desc:"All-in-one offensive recon multi-tool. Port scanning, HTTP header auditing, subdomain enumeration, DNS records, WHOIS, and tech fingerprinting with HTML report export.",lang:"Python",cat:"Red Team",tags:["python","recon","scanning","osint"],featured:4},
    {name:"GhostKit",slug:"GhostKit",url:"https://github.com/geevarghesekthomas84-sys/GhostKit",desc:"Portable cybersecurity suite for USB deployment — AI-assisted network auditing (Nmap), web vulnerability scanning (Nuclei), packet analysis (Wireshark), and an offline AI Security Assistant.",lang:"Python",cat:"Red Team",tags:["python","nmap","nuclei","usb","portable"],featured:5},
    {name:"Insider Threat Detection Lab",slug:"insider-threat-detection-lab",url:"https://github.com/geevarghesekthomas84-sys/insider-threat-detection-lab",desc:"Comprehensive Blue Team lab for detecting and responding to insider threat breaches using Wazuh, Splunk, and ELK. 50+ custom detection rules mapped to MITRE ATT&CK.",lang:"PowerShell",cat:"Blue Team",tags:["siem","wazuh","splunk","mitre-attack"],featured:6},
    {name:"Aegis",slug:"Aegis",url:"https://github.com/geevarghesekthomas84-sys/Aegis",desc:"Fully autonomous, locally hosted AI assistant for hospitals. Privacy-first architecture — patient data never leaves local infrastructure. Handles triage, appointment scheduling, and conversational intake.",lang:"TypeScript",cat:"AI",tags:["typescript","healthcare","llm","privacy"],featured:7},
    {name:"Dynamic Island Cross",slug:"dynamic-island-cross",url:"https://github.com/geevarghesekthomas84-sys/dynamic-island-cross",desc:"A Dynamic Island for your desktop: now playing, notifications, volume and charging in a floating pill. Built with Tauri, Rust and React for Windows, macOS and Linux.",lang:"TypeScript",cat:"Tools",tags:["tauri","rust","react","desktop"],featured:8},
    {name:"PortSight",slug:"PortSight",url:"https://github.com/geevarghesekthomas84-sys/PortSight",desc:"High-performance, multithreaded TCP port scanner with service detection and differential scan comparison.",lang:"Python",cat:"Red Team",tags:["python","networking","scanner"],featured:9},
    {name:"Portable Offline LLM",slug:"Portable-Offline-LLM",url:"https://github.com/geevarghesekthomas84-sys/Portable-Offline-LLM",desc:"Run a fully private, offline AI assistant from a USB flash drive — no installation, no internet, no admin rights required.",lang:"Batch",cat:"AI",tags:["llamafile","portable","usb","offline"],featured:10},
    {name:"Insider Threat Breach Response",slug:"Insider-Threat-Breach-Response",url:"https://github.com/geevarghesekthomas84-sys/Insider-Threat-Breach-Response",desc:"Professional SOC + DFIR project simulating a real-world enterprise insider data breach investigation in a financial organization.",lang:"Docs",cat:"Blue Team",tags:["soc","dfir","incident-response","mitre-attack"],featured:11},
    {name:"Reverse Shell Generator",slug:"reverse-shell-generator",url:"https://github.com/geevarghesekthomas84-sys/reverse-shell-generator",desc:"Web-based reverse shell payload generator. Supports Bash, Python, PowerShell, PHP, Ruby, Perl, Netcat. One-click copy. Dark hacker UI.",lang:"HTML",cat:"Red Team",tags:["html","payloads","pentesting"],featured:12},
    {name:"LocalLens",slug:"LocalLens",url:"https://github.com/geevarghesekthomas84-sys/LocalLens",desc:"High-performance local file search engine built with Node.js, SQLite FTS5, and Worker Threads.",lang:"JavaScript",cat:"Tools",tags:["nodejs","sqlite","search","fts5"],featured:13},
    {name:"PHP Security Posture",slug:"php-security-posture",url:"https://github.com/geevarghesekthomas84-sys/php-security-posture",desc:"Defensive PHP security posture auditing and CVE verification lab.",lang:"Python",cat:"Blue Team",tags:["python","php","audit","cve"],featured:14},
    {name:"Awesome Red Team",slug:"awesome-red-team",url:"https://github.com/geevarghesekthomas84-sys/awesome-red-team",desc:"Curated collection of awesome Red Team / Offensive Security resources, tools, techniques, and references.",lang:"Markdown",cat:"Red Team",tags:["awesome-list","resources","offensive-security"],featured:15},
    {name:"ApexBank",slug:"apexbank",url:"https://github.com/geevarghesekthomas84-sys/apexbank",desc:"Full-stack digital banking platform with real-time fraud detection, multi-currency accounts, and glassmorphism UI.",lang:"TypeScript",cat:"Tools",tags:["typescript","banking","fraud-detection"],featured:16},
    {name:"SlashFrame",slug:"image-style-skill",url:"https://github.com/geevarghesekthomas84-sys/image-style-skill",desc:"403 slash commands that turn a short idea into a finished AI image prompt. Works with Claude, ChatGPT, Gemini, Midjourney, Flux, ComfyUI and more.",lang:"Python",cat:"AI",tags:["python","ai-art","prompts","claude"],featured:17},
    {name:"Android AI Engineering",slug:"android-ai-engineering-system",url:"https://github.com/geevarghesekthomas84-sys/android-ai-engineering-system",desc:"14 AI engineering skills for Android development — UI/UX, frontend, testing, security, backend, DevOps, AI integration. Includes fullstack example app.",lang:"Kotlin",cat:"AI",tags:["kotlin","android","engineering","jetpack-compose"],featured:18}
  ];

  const cats=["All","Red Team","Blue Team","AI","Tools"];
  let activeCat="All";
  const tabsEl=document.getElementById('tabs');
  const resultsEl=document.getElementById('results');
  const searchEl=document.getElementById('search');
  const clearBtn=document.getElementById('clearBtn');
  const resultInfo=document.getElementById('resultInfo');

  function buildTabs(){
    tabsEl.innerHTML='';
    cats.forEach(c=>{
      const btn=document.createElement('button');
      btn.className='tab'+(activeCat===c?' active':'');
      btn.textContent=c;
      btn.onclick=()=>{activeCat=c;buildTabs();render()};
      tabsEl.appendChild(btn);
    });
  }

  function render(){
    const q=searchEl.value.toLowerCase().trim();
    let filtered=projects.filter(p=>{
      const catMatch=activeCat==='All'||p.cat===activeCat;
      const searchMatch=!q||p.name.toLowerCase().includes(q)||p.desc.toLowerCase().includes(q)||p.lang.toLowerCase().includes(q)||p.cat.toLowerCase().includes(q)||p.tags.some(t=>t.includes(q));
      return catMatch&&searchMatch;
    });

    filtered.sort((a,b)=>a.featured-b.featured);

    const total=activeCat==='All'?projects.length:projects.filter(p=>p.cat===activeCat).length;
    resultInfo.textContent=q
      ? 'About '+filtered.length+' results'
      : filtered.length+' projects';
    clearBtn.classList.toggle('show',q.length>0);

    if(!filtered.length){
      resultsEl.innerHTML='<div class="empty"><p>Your search — <strong style="color:var(--white)">'+esc(searchEl.value)+'</strong> — did not match any projects.</p></div>';
      return;
    }

    resultsEl.innerHTML=filtered.map(p=>{
      const displayUrl=p.url.replace('https://','');
      const initials=p.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
      return `
      <div class="result">
        <div class="result-site">
          <div class="result-favicon">${initials}</div>
          <div class="result-url-wrap">
            <div class="result-site-name">geevarghesekthomas84-sys</div>
            <div class="result-url">${displayUrl}</div>
          </div>
        </div>
        <a class="result-title" href="${p.url}" target="_blank" rel="noreferrer">${hl(p.name,q)} — ${hl(p.desc.split('.')[0],q)}</a>
        <div class="result-desc">${hl(p.desc,q)}</div>
        <div class="result-tags">${p.tags.map(t=>'<span class="result-tag">'+t+'</span>').join('')}<span class="result-tag" style="color:var(--lime)">${p.lang}</span></div>
      </div>`;
    }).join('');
  }

  function hl(text,q){
    if(!q)return text;
    const re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
    return text.replace(re,'<span class="hl">$1</span>');
  }

  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

  searchEl.addEventListener('input',render);
  clearBtn.addEventListener('click',()=>{searchEl.value='';render();searchEl.focus()});

  buildTabs();
  render();
  </script>
</body>
</html>
