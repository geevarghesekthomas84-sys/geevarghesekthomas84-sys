<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Access Denied | GG</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#101312;color:#e8eee9;font-family:'DM Mono',monospace;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px}
    .terminal{background:#070908;border:1px solid #263027;border-radius:6px;width:100%;max-width:620px;overflow:hidden}
    .terminal-bar{display:flex;gap:7px;padding:12px 16px;border-bottom:1px solid #263027}
    .terminal-bar i{width:11px;height:11px;border-radius:50%}
    .terminal-bar i:nth-child(1){background:#ff5f57}
    .terminal-bar i:nth-child(2){background:#febc2e}
    .terminal-bar i:nth-child(3){background:#28c840}
    .terminal-body{padding:28px 24px;line-height:2;font-size:14px;color:#a0ac9f}
    .terminal-body .prompt{color:#c8ff4a}
    .terminal-body .err{color:#ff5f57}
    .terminal-body .dim{color:#526058}
    .code-big{font-family:Manrope,sans-serif;font-size:clamp(80px,15vw,140px);font-weight:800;letter-spacing:-.06em;color:#c8ff4a;text-align:center;margin:0 0 10px;line-height:1;opacity:.15}
    .msg{text-align:center;margin-bottom:40px;color:#9ba39d;font-size:14px;font-family:'DM Mono',monospace}
    .home-link{display:inline-block;border:1px solid #303632;border-radius:999px;padding:14px 28px;color:#e8eee9;text-decoration:none;font:13px 'DM Mono',monospace;transition:border-color .2s,background .2s;margin-top:30px}
    .home-link:hover{border-color:#c8ff4a;background:rgba(200,255,74,.06)}
    .blink::after{content:'_';animation:b 1s step-end infinite}
    @keyframes b{0%,100%{opacity:1}50%{opacity:0}}
  </style>
</head>
<body>
  <p class="code-big">404</p>
  <p class="msg">This route doesn't exist. Maybe it was classified.</p>
  <div class="terminal">
    <div class="terminal-bar"><i></i><i></i><i></i></div>
    <div class="terminal-body">
      <span class="prompt">root@gg</span>:<span class="dim">~$</span> curl -s https://itgg.space/this-page<br>
      <span class="err">ERROR 404: ACCESS DENIED</span><br>
      <span class="dim">// target not found in directory</span><br>
      <span class="dim">// perhaps it was never here</span><br><br>
      <span class="prompt">root@gg</span>:<span class="dim">~$</span> <span class="blink">cd /home</span>
    </div>
  </div>
  <a class="home-link" href="/">← Return to base</a>
</body>
</html>
