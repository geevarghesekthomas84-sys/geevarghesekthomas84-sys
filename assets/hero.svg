<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" fill="none" role="img" aria-label="Geevarghese K Thomas — Offensive Security Researcher">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06080b"/>
      <stop offset="0.55" stop-color="#0a0e12"/>
      <stop offset="1" stop-color="#0d0705"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffcf5c"/>
      <stop offset="0.5" stop-color="#E0A82E"/>
      <stop offset="1" stop-color="#ff7a3b"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E0A82E" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E0A82E" stop-opacity="1"/>
      <stop offset="1" stop-color="#ff3b3b" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#1b2733" stroke-width="1" stroke-opacity="0.5"/>
    </pattern>
    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <clipPath id="frame"><rect x="0" y="0" width="900" height="240" rx="16"/></clipPath>
  </defs>

  <style>
    .title   { font-family: 'JetBrains Mono','Courier New',monospace; font-weight:800; }
    .mono    { font-family: 'JetBrains Mono','Courier New',monospace; }
    .pulse   { animation: pulse 3.2s ease-in-out infinite; }
    .cursor  { animation: blink 1s steps(1) infinite; }
    .scan    { animation: scan 6s linear infinite; }
    .sweepln { animation: sweep 4.5s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:.78} 50%{opacity:1} }
    @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
    @keyframes scan  { 0%{transform:translateY(-30px)} 100%{transform:translateY(270px)} }
    @keyframes sweep { 0%{transform:translateX(-260px)} 50%{transform:translateX(640px)} 100%{transform:translateX(-260px)} }
  </style>

  <g clip-path="url(#frame)">
    <rect width="900" height="240" fill="url(#bg)"/>
    <rect width="900" height="240" fill="url(#grid)"/>
    <rect width="900" height="240" fill="url(#vignette)"/>

    <!-- moving scanline -->
    <rect class="scan" x="0" y="0" width="900" height="2" fill="#E0A82E" opacity="0.07"/>

    <!-- top accent rail + animated sweep -->
    <rect x="0" y="0" width="900" height="3" fill="#15202b"/>
    <rect class="sweepln" x="0" y="0" width="260" height="3" fill="url(#sweep)"/>

    <!-- identity -->
    <text class="title pulse" x="48" y="96" font-size="42" fill="url(#amber)" filter="url(#glow)" letter-spacing="2">GEEVARGHESE K THOMAS</text>
    <text class="mono" x="50" y="128" font-size="15" fill="#9AA6B2" letter-spacing="4">OFFENSIVE SECURITY RESEARCHER · RED TEAM OPS · TOOL DEVELOPER</text>

    <!-- terminal line -->
    <g transform="translate(48,164)">
      <rect x="0" y="0" width="520" height="40" rx="8" fill="#0e141a" stroke="#1b2733"/>
      <circle cx="18" cy="20" r="4" fill="#ff5f56"/>
      <circle cx="34" cy="20" r="4" fill="#E0A82E"/>
      <circle cx="50" cy="20" r="4" fill="#27c93f"/>
      <text class="mono" x="72" y="25" font-size="15" fill="#E0A82E">$</text>
      <text class="mono" x="88" y="25" font-size="15" fill="#c7d0da">./breach --scope perimeter --ai</text>
      <rect class="cursor" x="392" y="12" width="9" height="17" fill="#E0A82E"/>
    </g>

    <!-- status chip -->
    <g transform="translate(720,172)">
      <rect x="0" y="0" width="132" height="26" rx="13" fill="#0e141a" stroke="#2a3a1c"/>
      <circle class="pulse" cx="18" cy="13" r="5" fill="#27c93f"/>
      <text class="mono" x="32" y="17" font-size="12" fill="#9AA6B2" letter-spacing="2">OPERATING</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="899" height="239" rx="16" fill="none" stroke="#1b2733"/>
</svg>
