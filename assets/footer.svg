<svg xmlns="http://www.w3.org/2000/svg" width="900" height="150" viewBox="0 0 900 150" fill="none" role="img" aria-label="footer">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0705"/>
      <stop offset="0.5" stop-color="#0a0e12"/>
      <stop offset="1" stop-color="#06080b"/>
    </linearGradient>
    <linearGradient id="famber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffcf5c"/>
      <stop offset="0.5" stop-color="#E0A82E"/>
      <stop offset="1" stop-color="#ff7a3b"/>
    </linearGradient>
    <linearGradient id="fsweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E0A82E" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E0A82E" stop-opacity="1"/>
      <stop offset="1" stop-color="#ff3b3b" stop-opacity="0"/>
    </linearGradient>
    <pattern id="fgrid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#141d26" stroke-width="1" stroke-opacity="0.5"/>
    </pattern>
    <filter id="fglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="fframe"><rect width="900" height="150" rx="16"/></clipPath>
  </defs>

  <style>
    .fmono { font-family:'JetBrains Mono','Courier New',monospace; }
    .fsweep{ animation: fsweep 4.5s ease-in-out infinite; }
    .fcur  { animation: fblink 1s steps(1) infinite; }
    .fdim  { animation: fdim 3.2s ease-in-out infinite; }
    @keyframes fsweep { 0%{transform:translateX(-260px)} 50%{transform:translateX(640px)} 100%{transform:translateX(-260px)} }
    @keyframes fblink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
    @keyframes fdim   { 0%,100%{opacity:.7} 50%{opacity:1} }
  </style>

  <g clip-path="url(#fframe)">
    <rect width="900" height="150" fill="url(#fbg)"/>
    <rect width="900" height="150" fill="url(#fgrid)"/>

    <!-- top rail + sweep -->
    <rect x="0" y="0" width="900" height="3" fill="#15202b"/>
    <rect class="fsweep" x="0" y="0" width="260" height="3" fill="url(#fsweep)"/>

    <!-- quote -->
    <text class="fmono fdim" x="450" y="66" font-size="19" fill="url(#famber)" filter="url(#fglow)" text-anchor="middle" font-style="italic">"I don't break things. I find ways in."</text>

    <!-- prompt sign-off -->
    <g transform="translate(450,100)" text-anchor="middle">
      <text class="fmono" x="-8" y="0" font-size="13" fill="#9AA6B2">root@gg:~# </text>
      <text class="fmono" x="84" y="0" font-size="13" fill="#c7d0da">exit</text>
    </g>
    <rect class="fcur" x="540" y="90" width="8" height="14" fill="#E0A82E"/>
  </g>
  <rect x="0.5" y="0.5" width="899" height="149" rx="16" fill="none" stroke="#1b2733"/>
</svg>
