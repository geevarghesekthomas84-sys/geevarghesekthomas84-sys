<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-label="I don't break things. I find ways in.">
  <style>
    .stamp{animation:s .5s cubic-bezier(.3,1.6,.5,1) 1s both;transform-origin:center;transform-box:fill-box}
    @keyframes s{from{opacity:0;transform:rotate(12deg) scale(1.6)}to{opacity:.9;transform:rotate(12deg) scale(1)}}
    .strike{stroke-dasharray:340;stroke-dashoffset:340;animation:k .5s ease .6s forwards} @keyframes k{to{stroke-dashoffset:0}}
  </style>
  <rect width="900" height="250" fill="#0b0c0b" rx="18"/>
  <g transform="rotate(-1.5 450 125)">
    <rect x="70" y="30" width="770" height="190" fill="#c8ff4a" transform="translate(9 9)"/>
    <rect x="70" y="30" width="770" height="190" fill="#f2f0ea"/>
    <rect x="395" y="20" width="120" height="24" fill="#c8ff4a" opacity=".9" transform="rotate(-3 455 32)"/>
    <text x="100" y="66" font-family="'Courier New',ui-monospace,monospace" font-size="11" fill="#0b0c0b" letter-spacing="2">FILE 0X01 · STATEMENT</text>
    <text x="810" y="66" text-anchor="end" font-family="'Courier New',ui-monospace,monospace" font-size="11" fill="#0b0c0b" letter-spacing="2">CLEARANCE: RED</text>
    <line x1="100" y1="76" x2="810" y2="76" stroke="#0b0c0b" stroke-width="2"/>
    <text x="100" y="138" textLength="560" lengthAdjust="spacingAndGlyphs" font-family="'Arial Black','Helvetica Neue',Impact,Arial,sans-serif" font-size="46" font-weight="900" fill="#0b0c0b" letter-spacing="-2">I DON'T BREAK THINGS.</text>
    <line class="strike" x1="307" y1="124" x2="447" y2="117" stroke="#ff2e63" stroke-width="7" stroke-linecap="round"/>
    <path d="M300 186 C420 172 560 196 700 178" stroke="#c8ff4a" stroke-width="16" stroke-linecap="round" fill="none"/>
    <text x="310" y="190" textLength="380" lengthAdjust="spacingAndGlyphs" font-family="'Arial Black','Helvetica Neue',Impact,Arial,sans-serif" font-size="38" font-weight="900" font-style="italic" fill="#0b0c0b" transform="rotate(-3 310 190)">I find ways in.</text>
    <g class="stamp"><rect x="694" y="156" width="130" height="36" rx="6" fill="none" stroke="#ff2e63" stroke-width="4"/><text x="759" y="181" textLength="110" lengthAdjust="spacingAndGlyphs" text-anchor="middle" font-family="'Arial Black','Helvetica Neue',Impact,Arial,sans-serif" font-size="15" font-weight="900" fill="#ff2e63" letter-spacing="2">CLASSIFIED</text></g>
  </g>
</svg>
